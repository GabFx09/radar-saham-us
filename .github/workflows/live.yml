name: Harga live

# Memperbarui docs/data/live.json tiap ±15 menit (valas, komoditas, kripto, indeks sepanjang hari; seluruh saham
# saat bursa AS buka) dan menjalankan alert harga & berita penting tiap ±30 menit.
#
# Jadwal cron GitHub untuk repo gratis sering tertunda berjam-jam atau dilewati, jadi workflow ini berjalan
# sebagai satu job panjang (±5,5 jam, berulang tiap 15 menit) lalu memicu dirinya sendiri. Cron di bawah hanya
# cadangan untuk menghidupkan rantai lagi bila terputus. Repo publik: menit Actions tidak dibatasi.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      KABAR_TOKEN: ${{ secrets.KABAR_TOKEN }}
      KABAR_VAPID: ${{ secrets.KABAR_VAPID }}
      KABAR_KUNCI: ${{ secrets.KABAR_KUNCI }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            docs/data/detail
            docs/data/history
            docs/data/stocks.json
            docs/data/makro.json
            docs/data/ipo.json
            docs/data/live.json
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Harga live + alert (berulang)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 330 * 60))
          n=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            git pull -q --rebase -X theirs || git rebase --abort || true
            python scripts/live.py || echo "::warning::live.py gagal"
            git add docs/data/live.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Harga live $(date -u +%H:%M)"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 8; done
            fi
            if [ $((n % 2)) -eq 0 ] && { [ -n "$GIST_TOKEN" ] || [ -n "$KABAR_TOKEN" ] || [ -n "$TELEGRAM_TOKEN" ]; }; then
              python scripts/notify.py alerts || echo "::warning::alert gagal"
            fi
            n=$((n + 1))
            left=$((end - SECONDS))
            [ $left -le 0 ] && break
            wait=$((900 - (SECONDS - start)))
            [ $wait -gt $left ] && wait=$left
            [ $wait -gt 0 ] && sleep $wait
          done
      - name: Lanjutkan rantai
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live.yml --ref ${{ github.ref_name }} -R ${{ github.repository }}
