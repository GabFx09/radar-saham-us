name: Harga live

# Memperbarui docs/data/live.json tiap ±20 menit: valas, komoditas, kripto, indeks sepanjang hari;
# seluruh saham saat bursa AS buka. Aplikasi memakai harga ini di atas data harian.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            docs/data/stocks.json
            docs/data/live.json
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance==1.8.0 pandas==3.1.1 numpy==2.5.2 requests
      - run: python scripts/live.py
      - name: Commit harga live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Harga live $(date -u +%H:%M)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
