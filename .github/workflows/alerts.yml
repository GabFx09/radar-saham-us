name: Alert harga & berita penting

# Alert rutin kini dijalankan di dalam workflow "Harga live" (tiap ±30 menit, lebih andal daripada cron GitHub).
# Workflow ini untuk menjalankan manual: alerts / digest / test.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "alerts / digest / test"
        default: "alerts"

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      KABAR_TOKEN: ${{ secrets.KABAR_TOKEN }}
      KABAR_VAPID: ${{ secrets.KABAR_VAPID }}
      KABAR_KUNCI: ${{ secrets.KABAR_KUNCI }}
    steps:
      - name: Lewati bila Telegram belum diatur
        if: ${{ env.GIST_TOKEN == '' && env.KABAR_TOKEN == '' && (env.TELEGRAM_TOKEN == '' || env.TELEGRAM_CHAT_ID == '') }}
        run: echo "Secret GIST_TOKEN/KABAR_TOKEN (atau TELEGRAM_TOKEN + TELEGRAM_CHAT_ID) belum diatur — tidak ada yang dikirim."
      - uses: actions/checkout@v4
        if: ${{ env.GIST_TOKEN != '' || env.KABAR_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        with:
          sparse-checkout: |
            scripts
            docs/data/detail
            docs/data/history
            docs/data/stocks.json
            docs/data/makro.json
            requirements.txt
      - uses: actions/setup-python@v5
        if: ${{ env.GIST_TOKEN != '' || env.KABAR_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        with:
          python-version: "3.12"
          cache: pip
      - if: ${{ env.GIST_TOKEN != '' || env.KABAR_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        run: pip install -r requirements.txt
      - if: ${{ env.GIST_TOKEN != '' || env.KABAR_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        run: python scripts/notify.py ${{ github.event.inputs.mode || 'alerts' }}
