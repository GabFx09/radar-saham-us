name: Alert harga & berita penting

on:
  schedule:
    # tiap 30 menit sepanjang hari: berita penting dicek kapan saja,
    # alert harga hanya dijalankan saat bursa AS buka (diatur di notify.py)
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "alerts / digest / test"
        default: "alerts"

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - name: Lewati bila Telegram belum diatur
        if: ${{ env.GIST_TOKEN == '' && (env.TELEGRAM_TOKEN == '' || env.TELEGRAM_CHAT_ID == '') }}
        run: echo "Secret GIST_TOKEN (atau TELEGRAM_TOKEN + TELEGRAM_CHAT_ID) belum diatur — tidak ada yang dikirim."
      - uses: actions/checkout@v4
        if: ${{ env.GIST_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        with:
          sparse-checkout: |
            scripts
            docs/data/detail
            docs/data/stocks.json
            docs/data/makro.json
            requirements.txt
      - uses: actions/setup-python@v5
        if: ${{ env.GIST_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        with:
          python-version: "3.12"
          cache: pip
      - if: ${{ env.GIST_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        run: pip install -r requirements.txt
      - if: ${{ env.GIST_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        run: python scripts/notify.py ${{ github.event.inputs.mode || 'alerts' }}
