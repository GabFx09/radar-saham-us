name: Update data screener

on:
  schedule:
    # Senin–Jumat 22:30 UTC (≈ 05:30 WIB), setelah bursa AS tutup
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      KABAR_TOKEN: ${{ secrets.KABAR_TOKEN }}
      KABAR_VAPID: ${{ secrets.KABAR_VAPID }}
      KABAR_KUNCI: ${{ secrets.KABAR_KUNCI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pulihkan cache laporan keuangan
        uses: actions/cache@v4
        with:
          path: .cache/fund
          key: fund-${{ github.run_id }}
          restore-keys: fund-
      - run: python scripts/screener.py --workers 6
      - name: Commit data baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update data screener $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull -q --rebase -X ours && git push -q && break; sleep 8; done
      - name: Kirim ringkasan pagi (Kabar / Telegram)
        if: ${{ env.GIST_TOKEN != '' || env.KABAR_TOKEN != '' || (env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '') }}
        continue-on-error: true
        run: python scripts/notify.py digest
      - name: Peringatan bila update gagal
        if: ${{ failure() && env.KABAR_TOKEN != '' }}
        run: |
          python scripts/kabar.py "Update data Radar Saham GAGAL" "Workflow update harian gagal — data di aplikasi bisa basi. Cek log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --saluran "Radar Saham" --prioritas tinggi --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
