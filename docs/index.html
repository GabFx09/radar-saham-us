<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar Saham US</title>
  <meta name="description" content="Screener saham Amerika berbasis fundamental + teknikal: skor, alasan beli, dan proyeksi kenaikan.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radar Saham">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="terminal.css">
  <script>
    try { var t = localStorage.getItem('theme') || 'dark'; if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Beranda">
        <span class="brand-mark">RS</span>
        <span class="brand-txt"><b>RADAR SAHAM</b><small>US EQUITY TERMINAL</small></span>
      </a>
      <button class="cmdline" id="cmdBtn" aria-label="Buka baris perintah">
        <span class="pr">&gt;</span><span class="ph">Ticker atau perintah… <span class="cur"></span></span><span class="go">&lt;GO&gt;</span>
      </button>
      <div class="clock" id="clock" aria-live="off"></div>
      <div class="top-actions">
        <button class="icon-btn hidden" id="btnSearch" aria-label="Cari saham">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn hidden" id="btnInstall" aria-label="Install aplikasi">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        </button>
        <a class="icon-btn" href="#/pengaturan" aria-label="Pengaturan &amp; notifikasi">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg>
        </a>
        <button class="icon-btn" id="btnTheme" aria-label="Ganti tema">
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="tape" aria-label="Ticker pasar"><div class="tape-in" id="tape"></div></div>
    <nav class="fkeys" aria-label="Navigasi utama"><div class="fkeys-in">
      <a href="#/" data-nav="home"><kbd>1</kbd>BERANDA</a>
      <a href="#/screener" data-nav="screener"><kbd>2</kbd>SCREENER</a>
      <a href="#/makro" data-nav="makro"><kbd>3</kbd>MAKRO</a>
      <a href="#/heatmap" data-nav="heatmap"><kbd>4</kbd>HEATMAP</a>
      <a href="#/siklus" data-nav="siklus"><kbd>5</kbd>SIKLUS</a>
      <a href="#/geo" data-nav="geo"><kbd>6</kbd>GEO</a>
      <a href="#/strategi" data-nav="strategi"><kbd>7</kbd>STRATEGI</a>
      <a href="#/watchlist" data-nav="watchlist"><kbd>8</kbd>WATCHLIST</a>
      <a href="#/pesan" data-nav="pesan"><kbd>9</kbd>PESAN</a>
      <a href="#/pengaturan" data-nav="pengaturan"><kbd>0</kbd>SETELAN</a>
    </div></nav>
  </header>
  <div id="subnav" class="container" style="padding-top:0;padding-bottom:0"></div>

  <main id="app" class="container" tabindex="-1">
    <div class="splash">
      <div class="spinner"></div>
      <p>Memuat data pasar…</p>
    </div>
  </main>

  <nav class="bottomnav" aria-label="Navigasi bawah">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Beranda</span>
    </a>
    <a href="#/screener" data-nav="screener">
      <svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg><span>Screener</span>
    </a>
    <a href="#/makro" data-nav="makro">
      <svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-6 4 3 5-8"/></svg><span>Pasar</span>
    </a>
    <a href="#/pesan" data-nav="pesan">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span>Pesan</span>
    </a>
    <a href="#/watchlist" data-nav="watchlist">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg><span>Watchlist</span>
    </a>
  </nav>

  <div id="searchOverlay" class="overlay hidden" role="dialog" aria-label="Cari saham">
    <div class="search-panel">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Cari ticker atau nama perusahaan…" autocomplete="off" spellcheck="false">
        <button class="text-btn" id="searchClose">Tutup</button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="sheet" class="sheet-wrap hidden" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script src="geo.js"></script>
  <script src="quant.js"></script>
  <script src="siklus.js"></script>
  <script src="term.js"></script>
  <script src="makro.js"></script>
  <script src="ext.js"></script>
  <script src="pesan.js"></script>
  <script src="porto.js"></script>
  <script src="ipo.js"></script>
  <script src="live.js"></script>
  <script src="rebal.js"></script>
</body>
</html>
